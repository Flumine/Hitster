<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HITSTER Trainer – Nederlands</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #121212; color: #fff;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 20px 16px 48px; gap: 14px;
}
h1 { font-size: 1.9rem; font-weight: 900; letter-spacing: -0.5px; margin-top: 6px; }
h1 em { color: #1DB954; font-style: normal; }
.sub { font-size: 0.78rem; color: #555; text-align: center; }

/* Stats */
.stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.stat {
  background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 12px;
  padding: 10px 16px; text-align: center; min-width: 70px;
}
.stat-n { font-size: 1.5rem; font-weight: 700; color: #1DB954; line-height: 1; }
.stat-l { font-size: 0.62rem; color: #555; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 4px; }

/* Progress */
.prog-wrap { width: 100%; max-width: 520px; }
.prog-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: #555; margin-bottom: 6px; }
.prog-bar { height: 5px; background: #222; border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; background: #1DB954; border-radius: 3px; transition: width 0.5s ease; }

/* Player */
.player-wrap {
  width: 100%; max-width: 520px; height: 80px;
  border-radius: 12px; overflow: hidden;
  background: #1e1e1e; position: relative;
}
#spotifyFrame { display: block; width: 100%; height: 80px; border: none; }

/* Covers album art + song title; Spotify controls are ~130px on the right */
.title-mask {
  position: absolute; top: 0; bottom: 0; left: 0; right: 130px;
  background: #1e1e1e; pointer-events: none; z-index: 2;
}
/* Full overlay shown before first play */
.player-overlay {
  position: absolute; inset: 0; background: #1e1e1e;
  display: flex; align-items: center; justify-content: center; z-index: 3;
}
.player-overlay.hidden { display: none; }
.play-btn {
  background: #1DB954; color: #000; border: none;
  padding: 11px 28px; border-radius: 50px;
  font-size: 0.95rem; font-weight: 700; cursor: pointer; letter-spacing: 0.3px;
  transition: filter 0.15s;
}
.play-btn:hover { filter: brightness(1.1); }

/* Card */
.card {
  width: 100%; max-width: 520px;
  background: #1e1e1e; border: 1px solid #2a2a2a;
  border-radius: 16px; padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
}

/* Retype banner */
.retype-banner {
  display: none; border-radius: 10px; padding: 14px;
  background: rgba(255,152,0,0.08); border: 1px solid rgba(255,152,0,0.3);
}
.retype-banner.on { display: block; }
.retype-title { font-size: 0.85rem; font-weight: 700; color: #ff9800; margin-bottom: 10px; }
.answer-box {
  background: #111; border-radius: 8px; padding: 10px 14px;
  font-size: 0.85rem; line-height: 1.8;
  display: grid; grid-template-columns: 64px 1fr; gap: 0 8px; align-items: center;
}
.al { color: #555; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
.av { color: #eee; font-weight: 600; word-break: break-word; }

/* Fields */
.field label {
  display: block; font-size: 0.7rem; color: #666;
  text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; margin-bottom: 6px;
}
.field input {
  width: 100%; padding: 11px 14px;
  background: #111; border: 2px solid #2a2a2a; border-radius: 8px;
  color: #fff; font-size: 0.95rem; outline: none;
  transition: border-color 0.15s, background 0.15s;
  appearance: none; -webkit-appearance: none;
}
.field input::placeholder { color: #3a3a3a; }
.field input:focus:not(.ok):not(.err):not(.rt) { border-color: #3a3a3a; }
.field input.ok  { border-color: #1DB954 !important; background: #0b1f0b; }
.field input.err { border-color: #e91429 !important; background: #1f0b0b; }
.field input.rt  { border-color: #ff9800 !important; background: #1e1400; }

/* Dots */
.dots { display: flex; gap: 6px; justify-content: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #2a2a2a; transition: background 0.2s; }
.dot.on { background: #e91429; }

/* Button */
.btn {
  width: 100%; padding: 13px; border-radius: 50px; border: none;
  background: #1DB954; color: #000; font-size: 0.95rem; font-weight: 700;
  cursor: pointer; transition: filter 0.15s, transform 0.1s; letter-spacing: 0.3px;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(0.98); }

/* Feedback */
.fb { display: none; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; text-align: center; line-height: 1.45; }
.fb.on  { display: block; }
.fb.ok  { background: rgba(29,185,84,.12);  color: #1DB954; border: 1px solid rgba(29,185,84,.25); }
.fb.err { background: rgba(233,20,41,.12);  color: #ff5060; border: 1px solid rgba(233,20,41,.25); }
.fb.inf { background: rgba(255,152,0,.12);  color: #ff9800; border: 1px solid rgba(255,152,0,.25); }

/* Spotify Connect */
.connect-btn {
  background: #1e1e1e; color: #1DB954;
  border: 1px solid #333; border-radius: 50px;
  padding: 7px 20px; font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s; letter-spacing: 0.3px;
}
.connect-btn:hover { border-color: #1DB954; }
.connect-status {
  display: none; width: 100%; max-width: 520px;
  font-size: 0.8rem; text-align: center; padding: 6px 0;
}
.connect-status.on  { display: block; color: #555; }
.connect-status.ok  { display: block; color: #1DB954; }
.connect-status.err { display: block; color: #ff9800; }
</style>
</head>

<p class="sub">Nederlands &middot; 308 nummers &middot; Luister en raad</p>
<button class="connect-btn" id="connectBtn">&#9835;&nbsp;Verbind Spotify</button>

  <div class="field">

  </div>
  <div class="field">
    <label>Artiest</label>
    <input id="iArtist" type="text" placeholder="Naam van de artiest…"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="field">
    <label>Jaar</label>
    <input id="iYear" type="text" inputmode="numeric" placeholder="Jaar (bijv. 1987)"
      autocomplete="off">
  </div>

  <div class="dots">
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
  </div>

  <button class="btn" id="submitBtn">Controleer &#10003;</button>
  <div class="fb" id="fb"></div>
</div>

// ── Spotify PKCE OAuth + Connect API ─────────────────────────────────────────
const CLIENT_ID   = '302732b5cb7b4ca59ce7b440370e9110';
const REDIRECT_URI = location.origin + location.pathname;
const SCOPES = 'user-modify-playback-state user-read-playback-state';

let spToken  = localStorage.getItem('sp_token');
let spExpiry = parseInt(localStorage.getItem('sp_expiry') || '0');

function tokenValid() { return !!spToken && Date.now() < spExpiry - 30000; }

function b64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function randVerifier() { const a=new Uint8Array(32); crypto.getRandomValues(a); return b64url(a); }
async function codeChallenge(v) {
  return b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
}

async function loginSpotify() {
  const v = randVerifier();
  localStorage.setItem('sp_verifier', v);
  const p = new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code',
    redirect_uri: REDIRECT_URI, scope: SCOPES,
    code_challenge_method: 'S256', code_challenge: await codeChallenge(v)
  });
  location.href = 'https://accounts.spotify.com/authorize?' + p;
}

async function handleOAuthCallback(code) {
  const v = localStorage.getItem('sp_verifier');
  if (!v) return;
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams({
      client_id: CLIENT_ID, grant_type: 'authorization_code',
      code, redirect_uri: REDIRECT_URI, code_verifier: v
    })
  });
  const d = await r.json();
  if (d.access_token) {
    spToken  = d.access_token;
    spExpiry = Date.now() + d.expires_in * 1000;
    localStorage.setItem('sp_token',  spToken);
    localStorage.setItem('sp_expiry', String(spExpiry));
    localStorage.removeItem('sp_verifier');
    history.replaceState({}, '', location.pathname);
    updateConnectBtn();
    setConnectStatus('✓ Spotify verbonden! Druk ▶ Luister om te starten.', 'ok');
  }
}

function updateConnectBtn() {
  const btn = el('connectBtn');
  if (tokenValid()) {
    btn.textContent = '✓ Spotify verbonden';
    btn.style.cssText = 'background:#0a3d1f;color:#1DB954;border:1px solid #1DB954;border-radius:50px;padding:7px 20px;font-size:0.82rem;font-weight:600;cursor:pointer;';
  } else {
    btn.textContent = '\u266b\u00a0Verbind Spotify';
    btn.style.cssText = '';
  }
}

async function playViaConnect(spotifyId) {
  let deviceId = '';
  try {
    const dr = await fetch('https://api.spotify.com/v1/me/player/devices', {
      headers: {'Authorization':'Bearer '+spToken}
    });
    if (dr.status === 401) { spToken = null; localStorage.removeItem('sp_token'); updateConnectBtn(); return false; }
    const dd = await dr.json();
    const dev = dd.devices && (dd.devices.find(d=>d.is_active) || dd.devices[0]);
    if (dev) deviceId = dev.id;
  } catch(e) {}

  if (!deviceId) return false;

  const resp = await fetch('https://api.spotify.com/v1/me/player/play?device_id=' + deviceId, {
    method: 'PUT',
    headers: {'Authorization':'Bearer '+spToken,'Content-Type':'application/json'},
    body: JSON.stringify({uris:['spotify:track:'+spotifyId], position_ms:0})
  });
  return resp.status === 204 || resp.status === 200;
}

// ── Spotify player ────────────────────────────────────────────────────────────
function setConnectStatus(msg, type) {
  const s = el('connectStatus');
  s.textContent = msg;
  s.className = 'connect-status ' + (type||'on');
}

function spawnIframe(spotifyId) {
  const wrap = document.querySelector('.player-wrap');
  const old  = el('spotifyFrame');
  if (old) old.remove();
  const f = document.createElement('iframe');
  f.id = 'spotifyFrame';
  f.style.cssText = 'display:block;width:100%;height:80px;border:none;';
  f.setAttribute('allow', 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture');
  f.setAttribute('allowtransparency', 'true');
  f.src = 'https://open.spotify.com/embed/track/' + spotifyId + '?autoplay=1&theme=0&_=' + Date.now();
  wrap.insertBefore(f, wrap.querySelector('.title-mask'));
}

function spotifyPlay(spotifyId) {
  if (!spotifyId) return;

  if (tokenValid()) {
    // Reset iframe to blank zo oude embed niet zichtbaar blijft
    const old = el('spotifyFrame');
    if (old) old.src = 'about:blank';
    setConnectStatus('\u266b Verbinden met Spotify\u2026', 'on');
    playViaConnect(spotifyId).then(ok => {
      if (ok) {
        setConnectStatus('\u266b Speelt in Spotify \u2014 volledig nummer van het begin', 'ok');
      } else {
        setConnectStatus('\u26a0\ufe0f Geen actief Spotify-apparaat. Open de Spotify app en probeer opnieuw.', 'err');
        spawnIframe(spotifyId);
      }
    }).catch(() => { setConnectStatus('', ''); spawnIframe(spotifyId); });
    return;
  }

  // Geen token: gewone iframe (moet synchroon in click-handler)
  el('connectStatus').className = 'connect-status';
  spawnIframe(spotifyId);
}

el('firstPlayBtn').addEventListener('click', () => {

  el('playerOverlay').classList.add('hidden');
});

el('connectBtn').addEventListener('click', loginSpotify);

(function() {

// ── Helpers ───────────────────────────────────────────────────────────────────
function norm(s) {
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\([^)]*\)/g, '').replace(/\[[^\]]*\]/g, '')
    .replace(/[^a-z0-9]/g, '').trim();
}
function titleOk(v, t)  { const a = norm(v); return a.length > 0 && a === norm(t.titel); }
function artistOk(v, t) {
  if (!v.trim()) return false;
  const a = norm(v);
  return a === norm(t.artiest) || a === norm(t.artiest.split(',')[0]);
}
function yearOk(v, t)   { return v.trim() !== '' && parseInt(v, 10) === t.jaar; }

function setFb(type, msg) { el('fb').className = 'fb on ' + type; el('fb').textContent = msg; }
function clearFb()        { el('fb').className = 'fb'; }
function setDots(n)       { el('d1').className='dot'+(n>=1?' on':''); el('d2').className='dot'+(n>=2?' on':''); }
function updateStats() {
  el('sPool').textContent = G.pool.length; el('sGood').textContent = G.score.good;
  el('sBad').textContent  = G.score.bad;   el('sStr').textContent  = G.score.streak;
  const pct = (G.pool.length / TRACKS.length * 100).toFixed(1);
  el('progFill').style.width = pct + '%';
  el('progLabel').textContent = G.pool.length + ' / ' + TRACKS.length + ' in pool';
}

// ── Pool ──────────────────────────────────────────────────────────────────────
function shuffle(a) {
  for (let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function initPool() {
  G.pool = shuffle(TRACKS.map((_,i)=>i)).slice(0,10);
  G.pool.forEach(i => { G.w[i]=5; G.wrong[i]=0; G.correct[i]=0; });
}
function addToPool() {
  // Voeg een nieuw nummer toe aan de pool
  const s = new Set(G.pool);
  const left = TRACKS.map((_,i)=>i).filter(i=>!s.has(i));
  if (!left.length) return;
  const p = left[0|Math.random()*left.length];
  G.pool.push(p); G.w[p]=5; G.wrong[p]=0; G.correct[p]=0;
}
function retireTrack(idx) {
  // Nummer 2x goed: geef zeer laag gewicht (zeldzaam), pool groeit NIET
  G.w[idx] = 0.1;
}
function pickNext() {
  const pool = G.pool.length>1 ? G.pool.filter(i=>i!==G.cur) : G.pool;
  const tot  = pool.reduce((s,i)=>s+G.w[i],0);
  let r = Math.random()*tot;
  for (const i of pool) { r -= G.w[i]; if (r<=0) return i; }
  return pool[pool.length-1];
}

// ── Load UI for a track (no Spotify call) ────────────────────────────────────
function load(idx) {
  G.cur=idx; G.rt=false; G.locked=false; G.pendingNext=null;
  const DEFAULTS = {iTitle:'Naam van het nummer…',iArtist:'Naam van de artiest…',iYear:'Jaar (bijv. 1987)'};
  Object.entries(DEFAULTS).forEach(([id,ph])=>{
    const e=el(id); e.value=''; e.className=''; e.placeholder=ph; e.readOnly=false;
  });
  el('rtBanner').className='retype-banner';
  el('submitBtn').textContent='Controleer ✓';
  clearFb(); setDots(G.wrong[idx]||0); updateStats();
  setTimeout(()=>el('iTitle').focus(),150);
}

// ── Go to next — MUST be called from a click (for autoplay) ──────────────────
function goNext(idx) {
  load(idx);
  spotifyPlay(TRACKS[idx].spotifyId); // direct click context → autoplay works
}

// ── Game logic ────────────────────────────────────────────────────────────────
function onSubmit() {
  if (G.pendingNext !== null) { goNext(G.pendingNext); return; }
  if (G.locked) return;
  if (G.rt) { checkRetype(); return; }

  const t = TRACKS[G.cur];
  const tv=el('iTitle').value, av=el('iArtist').value, yv=el('iYear').value;
  const tOk=titleOk(tv,t), aOk=artistOk(av,t), yOk=yearOk(yv,t);

  el('iTitle').className  = tv?(tOk?'ok':'err'):'';
  el('iArtist').className = av?(aOk?'ok':'err'):'';
  el('iYear').className   = yv?(yOk?'ok':'err'):'';

  if (tOk && aOk && yOk) onCorrect(t); else onWrong(t,tOk,aOk,yOk);
}

function onCorrect(t) {
  G.locked=true; G.score.good++; G.score.streak++;
  G.wrong[G.cur]=0;
  G.correct[G.cur]=(G.correct[G.cur]||0)+1;
  if (G.correct[G.cur] >= 2) {
    retireTrack(G.cur);
    setFb('ok','✅ Goed! "'+t.titel+'" — '+t.artiest+' ('+t.jaar+') 🎓 Afgerond!');
  } else {
    G.w[G.cur]=Math.max(1,G.w[G.cur]-1);
    addToPool(); // eerste keer goed → pool groeit
    setFb('ok','✅ Goed! "'+t.titel+'" — '+t.artiest+' ('+t.jaar+')');
  }
  G.pendingNext=pickNext();
  updateStats();
  el('submitBtn').textContent='▶ Volgende nummer';
}

function onWrong(t,tOk,aOk,yOk) {
  G.score.bad++; G.score.streak=0;
  G.wrong[G.cur]=(G.wrong[G.cur]||0)+1;
  G.w[G.cur]=Math.min(10,G.w[G.cur]+1);
  setDots(G.wrong[G.cur]); updateStats();
  if (G.wrong[G.cur]>=2) { enterRetype(t); return; }
  setFb('err','❌ Niet goed! Nog één kans…');
  if (tOk){el('iTitle').className='ok';el('iTitle').readOnly=true;}
    else   {el('iTitle').value='';el('iTitle').className='';el('iTitle').readOnly=false;}
  if (aOk){el('iArtist').className='ok';el('iArtist').readOnly=true;}
    else   {el('iArtist').value='';el('iArtist').className='';el('iArtist').readOnly=false;}
  if (yOk){el('iYear').className='ok';el('iYear').readOnly=true;}
    else   {el('iYear').value='';el('iYear').className='';el('iYear').readOnly=false;}
  if(!tOk)el('iTitle').focus();else if(!aOk)el('iArtist').focus();else el('iYear').focus();
}

function enterRetype(t) {
  G.rt=true;
  el('rtBanner').className='retype-banner on';
  el('rtTitel').textContent=t.titel; el('rtArtiest').textContent=t.artiest; el('rtJaar').textContent=String(t.jaar);
  ['iTitle','iArtist','iYear'].forEach(id=>{const e=el(id);e.value='';e.className='rt';e.readOnly=false;});
  el('iTitle').placeholder=t.titel; el('iArtist').placeholder=t.artiest; el('iYear').placeholder=String(t.jaar);
  el('submitBtn').textContent='Bevestig ✓';
  setFb('inf','🔁 Type het goede antwoord over om door te gaan');
  el('iTitle').focus();
}

function liveRetype() {
  if (!G.rt||G.locked) return;
  const t=TRACKS[G.cur];
  const tv=el('iTitle').value,av=el('iArtist').value,yv=el('iYear').value;
  const tOk=titleOk(tv,t),aOk=artistOk(av,t),yOk=yearOk(yv,t);
  if(tv)el('iTitle').className=tOk?'ok':'rt';
  if(av)el('iArtist').className=aOk?'ok':'rt';
  if(yv)el('iYear').className=yOk?'ok':'rt';
  if(tOk&&aOk&&yOk){
    G.locked=true; G.rt=false; G.wrong[G.cur]=0;
    setFb('ok','✅ Goed overgetypt!');
    G.pendingNext=pickNext();
    el('submitBtn').textContent='▶ Volgende nummer';
  }
}

function checkRetype() {
  const t=TRACKS[G.cur];
  const tOk=titleOk(el('iTitle').value,t),aOk=artistOk(el('iArtist').value,t),yOk=yearOk(el('iYear').value,t);
  if(tOk&&aOk&&yOk){
    G.locked=true; G.rt=false; G.wrong[G.cur]=0;
    setFb('ok','✅ Goed overgetypt!');
    G.pendingNext=pickNext();
    el('submitBtn').textContent='▶ Volgende nummer';
  } else {
    const tv=el('iTitle').value,av=el('iArtist').value,yv=el('iYear').value;
    if(tv)el('iTitle').className=tOk?'ok':'err';
    if(av)el('iArtist').className=aOk?'ok':'err';
    if(yv)el('iYear').className=yOk?'ok':'err';
    setFb('inf','⚠️ Nog niet correct, probeer opnieuw');
  }
}

// ── Events ────────────────────────────────────────────────────────────────────
el('submitBtn').addEventListener('click', onSubmit);
document.addEventListener('keydown', e => {
  if (e.key==='Enter' && document.activeElement && document.activeElement.tagName==='INPUT') onSubmit();
  // Spatie → focus de iframe zodat Spotify's eigen spatie-handler play/pause doet
  if (e.key===' ' && document.activeElement && document.activeElement.tagName!=='INPUT') {
    e.preventDefault();
    const f = el('spotifyFrame');
    if (f) f.focus();
  }
});
['iTitle','iArtist','iYear'].forEach(id => {
  el(id).addEventListener('input', ()=>{ if(G.rt) liveRetype(); });
});

// ── Start ─────────────────────────────────────────────────────────────────────
initPool();
load(pickNext());
</script>
</body>
</html>
